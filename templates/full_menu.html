{% extends 'base.html' %}
{% load static %}

{% block title %}Full Menu | Chai Grill{% endblock %}

{% block content %}

<main class="full-menu-viewer">

    <div class="full-menu-page">
        <img
            src="{% static 'images/full-menu/menu-1.png' %}"
            alt="Chai Grill Full Menu - Page 1"
            loading="eager"
        >
    </div>

    <div class="full-menu-page">
        <img
            src="{% static 'images/full-menu/menu-2.png' %}"
            alt="Chai Grill Full Menu - Page 2"
            loading="lazy"
        >
    </div>

    <div class="full-menu-page">
        <img
            src="{% static 'images/full-menu/menu-3.png' %}"
            alt="Chai Grill Full Menu - Page 3"
            loading="lazy"
        >
    </div>

    <div class="full-menu-page">
        <img
            src="{% static 'images/full-menu/menu-4.png' %}"
            alt="Chai Grill Full Menu - Page 4"
            loading="lazy"
        >
    </div>

</main>

{% endblock %}
