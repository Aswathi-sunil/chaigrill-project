{% extends 'base.html' %}
{% load static %}
{% block title %}Menus | Chai's Grill Kochi{% endblock %}

{% block content %}
<!-- PASTE: everything from "4. Special Avil Milks" through the closing </script> -->
<!-- 4. Special Avil Milks -->
<section id="menu" class="avil">
  <div class="avil__wrap"><h2 class="avil__title rv">Special Avil Milks</h2></div>
  <div class="avc" id="avcAvil"><div class="avc__track"></div></div>
</section>

<!-- 4b. Chai Varieties -->
<section id="chai-varieties" class="avil avil--next">
  <div class="avil__wrap"><h2 class="avil__title rv">Chai Varieties</h2></div>
  <div class="avc avc--cards" id="avcTea"><div class="avc__track"></div></div>
</section>

<!-- 4c. Malabar Snack Varieties -->
<section id="snack-varieties" class="avil avil--next">
  <div class="avil__wrap"><h2 class="avil__title rv">Malabar Snack Varieties</h2></div>
  <div class="avc avc--cards" id="avcSnacks"><div class="avc__track"></div></div>
</section>

<!-- 4d. Grills & Broasted -->
<section id="grills-broasted" class="avil avil--next">
  <div class="avil__wrap"><h2 class="avil__title rv">Grills &amp; Broasted</h2></div>
  <div class="avc avc--cards" id="avcGrills"><div class="avc__track"></div></div>

</section>

<script>
(function () {
  var HOLD = 1850, SLIDE = 500;                 // ms between slides / ms the slide takes
  var EXTS = ["png", "webp", "jpg", "jpeg"];
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // [display name, file name without extension]
  var AVIL = [
    ["Badam", "badam"], ["Royal", "royal"], ["Dates", "dates"], ["Russian", "russian"],
    ["Pista", "pista"], ["Irani", "irani"], ["Fruit Special", "fruit_special"], ["Fig Honey", "fig_honey"]
  ];
  var TEA = [
    ["Biscuit Tea", "biscuit"], ["Elaichi Tea", "cardamom"], ["Saffron Tea", "saffron"],
    ["Masala Tea", "masala"], ["Ginger Tea", "ginger"], ["Lemon Tea", "limet"], ["Muhabbath Tea", "muhabbath"],
    ["Special Tea", "special_tea"]
  ];
  var SNACKS = [
    ["Beef Ball", "beef"], ["Chatti Pathiri", "chatti_pathiri"], ["Chicken Cutlet", "cutlet"],
    ["Chicken Samosa", "chicken_samosa"], ["Kallumakkaya", "kallummakaya"], ["Spring Roll", "spring"], ["Unnakkaya", "unnakkaya"],
    ["Chicken Roll", "roll"], ["Pathiri", "pathiri"]
  ];
    var GRILLS = [
    ["Shawaya Mandhi", "shawaya_mandhi"], ["Masala Shawaya", "masala_shawaya"],
    ["Honey Chillie Shawaya", "honey_chillie_shawaya"], ["Peri Peri Shawaya", "peri_peri_shawaya"],
    ["Crispy Fried Chicken", "crispy_fried_chicken"],
    ["Wings", "wings"], ["Boneless Strips", "boneless_strips"], ["Pops", "pops"]
  ];

  // tries .png, then .webp, .jpg, .jpeg; shows a placeholder if none exist
  window.cgNext = function (img) {
    var n = (+img.dataset.n || 0) + 1;
    if (n < EXTS.length) { img.dataset.n = n; img.src = img.dataset.b + img.dataset.f + "." + EXTS[n]; }
    else { img.parentNode.classList.add("is-empty"); img.remove(); }
  };

  function make(boxId, base, list, cards, delay) {
    var box = document.getElementById(boxId), track = box.firstElementChild, N = list.length;
    function item(it, copy) {
      var img = '<img src="' + base + it[1] + '.png" data-b="' + base + '" data-f="' + it[1] +
                '" alt="' + (copy ? '' : it[0]) + '" draggable="false" loading="lazy" onerror="cgNext(this)">';
      return '<div class="avc__item"' + (copy ? ' aria-hidden="true"' : '') + '>' +
        (cards ? '<div class="avc__card">' + img + '<h3 class="avc__name">' + it[0] + '</h3></div>'
               : '<div class="avc__glass">' + img + '</div><h3 class="avc__name">' + it[0] + '</h3>') + '</div>';
    }
    // the first 3 are repeated at the end so the loop has no gap
    track.innerHTML = list.map(function (it) { return item(it, false); }).join("") +
                      list.slice(0, 3).map(function (it) { return item(it, true); }).join("");

    var vis = 3, idx = 0, paused = false;
    function perView() {
      var w = innerWidth;
      if (cards && w >= 1100) return 4;          // chai + snack cards: 4 per row on desktop
      return w >= 900 ? 3 : (w >= 600 ? 2 : 1);
    }
    function go(i, anim) {
      track.style.transition = anim ? "transform " + SLIDE + "ms cubic-bezier(.65,0,.35,1)" : "none";
      track.style.transform = "translateX(" + (-i * 100 / vis) + "%)";
    }
    function next() { idx++; go(idx, true); if (idx >= N) setTimeout(function () { idx = 0; go(0, false); }, SLIDE + 30); }
    function prev() { if (idx === 0) { go(N, false); void track.offsetWidth; idx = N; } idx--; go(idx, true); }
    function layout() { vis = perView(); box.style.setProperty("--vis", vis); idx = 0; go(0, false); }
    layout(); addEventListener("resize", layout);

    if (!reduce) setTimeout(function () {                 // staggered start so rows don't slide together
      setInterval(function () { if (!paused && !document.hidden) next(); }, HOLD);
    }, delay);
    box.addEventListener("mouseenter", function () { paused = true; });
    box.addEventListener("mouseleave", function () { paused = false; });

    var sx = null;                                         // swipe on phones
    box.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; paused = true; }, { passive: true });
    box.addEventListener("touchend", function (e) {
      if (sx !== null) { var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); } }
      sx = null; setTimeout(function () { paused = false; }, 2500);
    });
  }

  make("avcAvil",   "/static/images/avil/",   AVIL,   false, 0);
  make("avcTea",    "/static/images/tea/",    TEA,    true,  600);
  make("avcSnacks", "/static/images/snacks/", SNACKS, true,  1200);
    make("avcGrills", "/static/images/grills/", GRILLS, true, 1800);

  // title reveal
  if (!("IntersectionObserver" in window) || reduce) return;
  document.documentElement.classList.add("rv-on");
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll(".rv").forEach(function (el) { io.observe(el); });
})();
</script>
<script>
/* keep the hero clear of the fixed header, whatever its height */
(function () {
  var h = document.getElementById("main-header");
  if (!h) return;
  function set() { document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px"); }
  set();
  addEventListener("resize", set);
  addEventListener("load", set);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(set);
})();
</script>


{% endblock %}
